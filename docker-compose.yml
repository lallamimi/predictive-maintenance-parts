services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maintenance_predictive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./src/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cle-a-changer-en-production}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://postgres:postgres@db:5432/maintenance_predictive
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ML_MODELS_DIR: /app/models
    volumes:
      - ./data/processed/models:/app/models:ro  # modeles entraines, montes en lecture seule
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
