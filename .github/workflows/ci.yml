name: ci

on:
  push:
  pull_request:

jobs:
  data-and-ml:
    name: Pipeline donnees + entrainement des modeles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dependances data/ML
        run: pip install -r requirements.txt

      - name: Collecte (dataset public + generation synthetique)
        run: |
          python src/collect/download_ai4i.py
          python src/collect/generate_synthetic_parts.py

      - name: Nettoyage et validation du dataset
        run: |
          python src/clean/clean_maintenance.py
          python src/clean/validate_dataset.py

      - name: Tests unitaires couche Donnees (colonnes, types, valeurs manquantes, formats)
        run: python -m pytest tests/ -v

      - name: Requetes SQL d'analyse
        run: python src/sql/run_queries.py

      - name: Entrainement des modeles
        run: |
          python src/ml/train_failure_model.py
          python src/ml/train_demand_model.py

      - name: Archiver les modeles entraines pour le job backend
        uses: actions/upload-artifact@v4
        with:
          name: modeles-entraines
          path: data/processed/models/
          retention-days: 1

  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    needs: data-and-ml
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/backend/requirements.txt

      - name: Installer les dependances backend
        run: pip install -r requirements.txt

      - name: Lint (verifications legeres - imports/noms non definis)
        run: ruff check . --select=F,E9

      - name: Recuperer les modeles entraines
        uses: actions/download-artifact@v4
        with:
          name: modeles-entraines
          path: data/processed/models/

      - name: Preparer l'environnement (.env de CI)
        run: |
          echo "DJANGO_SECRET_KEY=cle-de-test-ci-non-utilisee-en-production" >> .env
          echo "DJANGO_DEBUG=0" >> .env
          echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1" >> .env

      - name: Migrations
        run: python manage.py migrate --noinput

      - name: Lancer les tests avec rapport de couverture
        run: python -m pytest -v --cov=. --cov-report=term-missing --cov-report=html

      - name: Archiver le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-backend
          path: src/backend/htmlcov/
          retention-days: 7

  frontend-build:
    name: Lint + build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Installer les dependances frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests (Vitest + Testing Library)
        run: npm test

      - name: Build de production
        run: npm run build

  docker-build:
    name: Packaging Docker (livraison continue - C19)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer les modeles entraines
        uses: actions/download-artifact@v4
        with:
          name: modeles-entraines
          path: data/processed/models/

      - name: Build de l'image backend
        run: docker build -t maintenance-predictive-backend:${{ github.sha }} ./src/backend

      - name: Build de l'image frontend
        run: docker build -t maintenance-predictive-frontend:${{ github.sha }} ./src/frontend

      - name: Verifier que le backend demarre reellement depuis l'image construite
        run: |
          docker run -d --name backend-smoke-test \
            -e DJANGO_SECRET_KEY=cle-de-test-ci \
            -e DJANGO_DEBUG=0 \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e ML_MODELS_DIR=/app/models \
            -v "$PWD/data/processed/models:/app/models:ro" \
            -p 8000:8000 \
            maintenance-predictive-backend:${{ github.sha }}

          echo "--- Etat du conteneur juste apres lancement ---"
          sleep 3
          docker ps -a
          echo "--- Logs du conteneur (demarrage) ---"
          docker logs backend-smoke-test

          echo "--- Sondage de /api/health/ ---"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health/; then
              echo ""
              echo "Backend operationnel (tentative $i)."
              exit 0
            fi
            sleep 3
          done

          echo "Le backend n'a pas repondu a temps. Logs complets :"
          docker logs backend-smoke-test
          docker ps -a
          exit 1
